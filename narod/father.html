<main><section class="inner-sheet snake-sheet father-sheet">
<h1 class="bad-heading" data-i18n="heading">Father</h1>
<div class="father-machine" id="father-game">
<div class="father-playfield">
  <div class="father-hud">
    <label><span data-f="stamina">Stamina</span><meter id="f-stamina" min="0" max="100" value="100"></meter></label>
    <label><span data-f="fear">Fear</span><meter id="f-fear" min="0" max="100" value="0"></meter></label>
    <span id="f-key"><span id="f-key-name">Key</span><span id="f-key-slot" aria-hidden="true"></span></span>
  </div>
  <div class="father-screen">
    <canvas id="f-board" width="640" height="480" tabindex="0" aria-label="Father game"></canvas>
    <div id="f-overlay" role="status"><span id="f-message">Loading the apartment…</span></div>
  </div>
  <div class="father-objective" aria-live="polite"><span id="f-objective"></span><span id="f-prompt"></span></div>
</div>
<div class="father-input">
  <p class="father-note father-content-note" data-f="note">Contains implied domestic violence.</p>
  <div class="father-actions">
    <button id="f-start" disabled>Start</button><button id="f-pause" disabled>Pause</button>
    <button id="f-sound" aria-pressed="true">SFX on</button><button id="f-ambient" aria-pressed="true">Ambience on</button>
  </div>
  <div class="father-touch">
    <div class="father-pad">
      <button data-hold="up" data-f-aria="up" aria-label="Up">▲</button>
      <button data-hold="left" data-f-aria="left" aria-label="Left">◀</button>
      <button data-hold="down" data-f-aria="down" aria-label="Down">▼</button>
      <button data-hold="right" data-f-aria="right" aria-label="Right">▶</button>
    </div>
    <div class="father-act">
      <button data-hold="sprint" data-f="run">Run</button>
      <button data-hold="quiet" data-f="quiet">Quiet</button>
      <button data-hold="interact" data-f="interact">Interact</button>
    </div>
  </div>
  <p class="father-note father-keyboard" data-f="hint">Arrows / WASD move · Shift run · Ctrl quiet · E / Space interact · P pause · R restart · M mute</p>
</div>
<div id="f-debug" hidden><button id="f-noai">AI on/off</button><button id="f-win">Preview escape</button><button id="f-lose">Preview caught</button><button id="f-grid">Grid / state</button><button id="f-reset">Reset</button><output id="f-debug-info"></output></div>
