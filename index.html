<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Vladislav Lanskikh</title>
  <meta name="description" content="Photography and visual art by Vladislav Lanskikh.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #6f6f6f;
      --rule: #d9d9d9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 30px 36px 30px;
    }

    header,
    footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.19em;
      text-transform: uppercase;
      font-weight: 400;
    }

    header {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--rule);
    }

    .status {
      color: var(--muted);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 310px);
      gap: 8vw;
      align-items: center;
      padding: 9vh 3vw 10vh;
    }

    .name {
      margin: 0;
      max-width: 920px;
      font-family: "IBM Plex Sans", Arial, Helvetica, sans-serif;
      font-size: clamp(58px, 8.2vw, 132px);
      font-weight: 300;
      line-height: 0.93;
      letter-spacing: -0.055em;
    }

    .name span {
      display: block;
    }

    .meta {
      align-self: end;
      padding-bottom: 0.8em;
    }

    .meta p {
      margin: 0;
    }

    .discipline {
      font-size: 11px;
      line-height: 1.6;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .note {
      max-width: 255px;
      margin-top: 28px !important;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      font-weight: 300;
    }

    footer {
      padding-top: 18px;
      border-top: 1px solid var(--rule);
    }

    nav {
      display: flex;
      gap: 26px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
    }

    .year {
      color: var(--muted);
    }

    @media (max-width: 760px) {
      main {
        padding: 22px 20px 24px;
      }

      header {
        font-size: 9px;
        letter-spacing: 0.14em;
      }

      .hero {
        grid-template-columns: 1fr;
        align-items: start;
        gap: 52px;
        padding: 18vh 0 12vh;
      }

      .name {
        font-size: clamp(54px, 17vw, 90px);
        line-height: 0.92;
      }

      .meta {
        align-self: auto;
        padding: 0;
      }

      footer {
        flex-direction: column;
        align-items: flex-start;
        font-size: 9px;
        letter-spacing: 0.14em;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>Vladislav Lanskikh</div>
      <div class="status">Photography / Visual Art</div>
    </header>

    <section class="hero">
      <h1 class="name">
        <span>Vladislav</span>
        <span>Lanskikh</span>
      </h1>

      <div class="meta">
        <p class="discipline">
          Artist &amp; photographer<br>
          based in Saint Petersburg
        </p>

        <p class="note">
          Selected works, texts and ongoing projects.
        </p>
      </div>
    </section>

    <footer>
      <nav aria-label="Social links">
        <a href="https://www.instagram.com/vlans.ph/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://t.me/lansvlad" target="_blank" rel="noopener noreferrer">Telegram</a>
      </nav>

      <div class="year">2026</div>
    </footer>
  </main>
</body>
</html>
