<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vladislav Lanskikh</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f3f0;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(760px, calc(100% - 48px));
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 88px);
      font-weight: 400;
      letter-spacing: -0.05em;
      line-height: 0.95;
    }

    p {
      margin: 24px 0 0;
      font-size: 15px;
      line-height: 1.5;
    }

    .links {
      display: flex;
      gap: 18px;
      margin-top: 28px;
    }

    .links a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(0, 0, 0, 0.3);
      padding-bottom: 2px;
    }

    .links a:hover {
      border-bottom-color: #111;
    }

    .muted {
      margin-top: 64px;
      opacity: 0.45;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Vladislav<br>Lanskikh</h1>

    <p>Photography / visual art</p>

    <div class="links">
      <a href="https://www.instagram.com/vlans.ph/" target="_blank" rel="noopener noreferrer">
        Instagram
      </a>

      <a href="https://t.me/lansvlad" target="_blank" rel="noopener noreferrer">
        Telegram
      </a>
    </div>

    <p class="muted">Portfolio coming soon.</p>
  </main>
</body>
</html>
